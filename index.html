<body data-tool="hours-calc">
<main class="s3-main">
  <section class="s3-hero no-print">
    <h1>Hours Calc</h1>
    <p>Fill in your shifts for the week and get hours worked, overtime and pay. Overnight shifts and several shifts a day just work. Saved in this browser only.</p>
  </section>

  <section class="card no-print">
    <div class="hc-settings">
      <label class="field">Week starts on
        <select class="select" id="weekStart">
          <option value="6">Saturday</option>
          <option value="0">Sunday</option>
          <option value="1">Monday</option>
        </select>
      </label>
      <label class="field">Week of (optional)
        <input class="input" type="date" id="weekOf">
      </label>
      <label class="field">Hourly rate
        <input class="input" id="rate" inputmode="decimal" autocomplete="off" placeholder="0">
      </label>
      <label class="field">Currency
        <input class="input" id="cur" maxlength="6" autocomplete="off" placeholder="JD" dir="auto">
      </label>
      <label class="field">Daily overtime after (h)
        <input class="input" id="dailyOT" inputmode="decimal" autocomplete="off" placeholder="off">
      </label>
      <label class="field">Weekly overtime after (h)
        <input class="input" id="weeklyOT" inputmode="decimal" autocomplete="off" placeholder="off">
      </label>
      <label class="field">Overtime pay ×
        <input class="input" id="mult" inputmode="decimal" autocomplete="off" placeholder="1.5">
      </label>
      <label class="field">Round each shift
        <select class="select" id="round">
          <option value="0">No rounding</option>
          <option value="5">Nearest 5 min</option>
          <option value="6">Nearest 6 min (0.1 h)</option>
          <option value="15">Nearest 15 min</option>
        </select>
      </label>
    </div>
  </section>

  <section class="card mt hc-sheet">
    <div class="row between">
      <h2 id="sheetTitle">Time card</h2>
      <div class="row no-print">
        <button class="btn ghost small" id="clear"><svg class="i"><use href="#i-trash"/></svg>Clear week</button>
        <button class="btn small" id="print"><svg class="i"><use href="#i-file"/></svg>Print</button>
        <button class="btn small" id="csv"><svg class="i"><use href="#i-download"/></svg>CSV</button>
        <button class="btn small primary" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy summary</button>
      </div>
    </div>
    <div class="stats mt" id="totals"></div>
    <div class="hc-days mt" id="days"></div>
    <p class="faint mt" id="otNote"></p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
